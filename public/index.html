<!DOCTYPE html>

<html>

<head>

<title>

Gym Weight Converter

</title>

<link rel="stylesheet"

href="style.css">

</head>

<body>

<div class="card">

</option>

</select>


<button onclick="convertir()">

</button>


<h2 id="resultado">

</h2>

</div>

<script src="script.js">

</script>

</body>

</html>
